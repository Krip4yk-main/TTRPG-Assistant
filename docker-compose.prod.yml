# Продакшн-стек. Збірка/запуск: див. docs/ops/deploy.md
# Змінні для ${...} беруться з кореневого .env (поруч із цим файлом) або з оточення.
# Секрети лише в .env-файлах (backend/.env, bot/.env, корінь) — не в цьому файлі.
# Обов'язкові (${VAR:?…}): MYSQL_ROOT_PASSWORD, MYSQL_USER, MYSQL_PASSWORD — без них compose
# не запуститься. BACKUP_* необов'язкові для старту: без них сервіс backup відмовляється працювати.
# Середовище: DEPLOY_ENV=dev|prod у кореневому env-файлі (за замовчуванням prod). Dev-сервер
# запускається тим самим файлом з іншим env: docker compose --env-file .env.dev -f docker-compose.prod.yml up -d
# (див. docs/ops/environments.md). BACKUP_ENABLED=false вимикає сервіс backup (сидить без роботи).
# /api і /socket.io на backend:3000 та статику з frontend:8080 віддає зовнішній reverse proxy.

x-restart: &restart
  restart: unless-stopped

# Спільні перевизначення адрес сервісів (мають пріоритет над значеннями з env_file)
x-backend-env: &backend-env
  DATABASE_URL: mysql://${MYSQL_USER:?set MYSQL_USER in the root .env}:${MYSQL_PASSWORD:?set MYSQL_PASSWORD in the root .env}@mysql:3306/nri
  REDIS_URL: redis://redis:6379
  # Одне джерело правди про середовище — кореневий env-файл (перекриває backend/.env)
  DEPLOY_ENV: ${DEPLOY_ENV:-prod}

services:
  mysql:
    <<: *restart
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in the root .env}
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER in the root .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in the root .env}
      MYSQL_DATABASE: nri
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # Пароль — через MYSQL_PWD у середовищі, а не аргументом (його видно в `ps`).
      test: ['CMD-SHELL', 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 -uroot --silent']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    <<: *restart
    image: redis:8
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # Одноразова міграція БД перед стартом бекенду
  migrate:
    image: ttrpg-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: 'no'
    command: ['node', '--import', 'tsx', 'src/db/migrate.ts']
    env_file: backend/.env
    environment:
      <<: *backend-env
    depends_on:
      mysql:
        condition: service_healthy

  # API + воркер джобів (воркер працює всередині процесу API, див. backend/src/server.ts)
  backend:
    <<: *restart
    image: ttrpg-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: backend/.env
    environment:
      <<: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - '127.0.0.1:3000:3000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health/live').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  bot:
    <<: *restart
    image: ttrpg-bot
    build:
      context: .
      dockerfile: bot/Dockerfile
    env_file: bot/.env
    environment:
      BACKEND_INTERNAL_URL: http://backend:3000/api/internal
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    <<: *restart
    image: ttrpg-frontend
    build:
      context: .
      dockerfile: frontend/Dockerfile
      # Налаштування фронтенду вшиваються на збірці (не секрети), див. frontend/.env.template
      args:
        NG_APP_DEPLOY_ENV: ${DEPLOY_ENV:-prod}
        NG_APP_TELEGRAM_BOT_USERNAME: ${NG_APP_TELEGRAM_BOT_USERNAME:-}
        NG_APP_GOOGLE_LOGIN: ${NG_APP_GOOGLE_LOGIN:-}
        NG_APP_DISCORD_LOGIN: ${NG_APP_DISCORD_LOGIN:-}
    environment:
      # nginx: на dev додає X-Robots-Tag: noindex, nofollow
      DEPLOY_ENV: ${DEPLOY_ENV:-prod}
    ports:
      - '127.0.0.1:8080:8080'

  # Зашифровані бекапи БД: щодня 03:30 UTC, перевірка відновлення щонеділі 04:30 UTC.
  # Разово: docker compose -f docker-compose.prod.yml run --rm backup backup|restore-check
  # Див. docs/ops/backups.md (користувач MySQL `backup`, R2/B2, ручне відновлення).
  backup:
    <<: *restart
    image: ttrpg-backup
    build:
      context: .
      dockerfile: scripts/ops/Dockerfile.backup
    init: true
    environment:
      # false — сервіс нічого не робить (dev-сервер); див. docs/ops/environments.md
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      BACKUP_DB_HOST: mysql
      BACKUP_DB_USER: ${BACKUP_DB_USER:-backup}
      BACKUP_DB_PASSWORD: ${BACKUP_DB_PASSWORD:-}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
    volumes:
      - backups:/backups
    # Option-файл з паролем MySQL живе лише в пам'яті
    tmpfs:
      - /tmp:size=16m
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
  backups:
