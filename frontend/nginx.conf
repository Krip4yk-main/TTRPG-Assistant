# Шаблон: ${DEPLOY_ENV} підставляє entrypoint образу (envsubst; решта $-змінних nginx не чіпає).
# На dev усі відповіді мають X-Robots-Tag; порожнє значення add_header не виводить.
map "${DEPLOY_ENV}" $robots_tag {
  default "";
  dev "noindex, nofollow";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Заголовки безпеки (frame-ancestors, nosniff, Referrer-Policy) — у кожному location,
  # бо add_header усередині location скасовує успадкування з server.
  include /etc/nginx/snippets/security-headers.conf;

  # Хешовані бандли кешуються надовго; index.html і переклади — ні.
  location ~* \.(?:js|css|woff2?|ico|png|svg)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
  }

  location /assets/i18n/ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # SPA: усі інші маршрути віддають index.html.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
  }
}
