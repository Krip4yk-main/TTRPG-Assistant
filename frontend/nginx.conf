server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Хешовані бандли кешуються надовго; index.html і переклади — ні.
  location ~* \.(?:js|css|woff2?|ico|png|svg)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location /assets/i18n/ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
  }

  # SPA: усі інші маршрути віддають index.html.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
