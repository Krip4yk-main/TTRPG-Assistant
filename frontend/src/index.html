<!doctype html>
<html lang="uk" data-theme="quest-board">
  <head>
    <meta charset="utf-8" />
    <title>НРІ Асистент</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Токен апеляції з ?appeal= та інші параметри не потрапляють у Referer на інші сайти. -->
    <meta name="referrer" content="same-origin" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="НРІ Асистент — пошук ігор у настільні рольові ігри" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!--
      Дизайн до старту застосунку (без мигання): data-theme, color-scheme (style і meta), ранній колір
      фону <html> (поки бандл стилів не завантажився й застосунок не відмалювався — колір, який
      дизайн показує найбільше) і <link> бандла стилів з останнього чинного дизайну в localStorage. Кеш — лише підказка: права й версію
      перевіряє ThemeService після /api/me. Мапа «дизайн → [бандл, схема, фон]» — як THEMES у
      src/app/theming/theme.registry.ts (фон — як у бандлі дизайну: дерево «Дошки», --nri-bg «Класичного»). Якщо з'явиться CSP зі script-src — потрібен хеш скрипту.
    -->
    <script>
      (function () {
        var themes = {
          'quest-board': ['quest-board', 'light', '#3a2718'],
          classic: ['classic', 'dark', '#0f172a'],
        };
        var id = 'quest-board';
        var v = '';
        try {
          var stored = localStorage.getItem('nri.theme');
          if (stored && Object.prototype.hasOwnProperty.call(themes, stored)) id = stored;
          v = localStorage.getItem('nri.theme.v') || '';
        } catch (e) {
          // Сховище недоступне — дизайн за замовчуванням.
        }
        var theme = themes[id];
        var root = document.documentElement;
        root.setAttribute('data-theme', id);
        root.style.colorScheme = theme[1];
        root.style.backgroundColor = theme[2];
        var meta = document.querySelector('meta[name="color-scheme"]');
        if (meta) meta.setAttribute('content', theme[1]);
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.id = 'nri-theme-style';
        link.href = 'theme-' + theme[0] + '.css' + (/^[a-z0-9]+$/.test(v) ? '?v=' + v : '');
        document.head.appendChild(link);
      })();
    </script>
  </head>
  <body>
    <nri-root></nri-root>
  </body>
</html>
