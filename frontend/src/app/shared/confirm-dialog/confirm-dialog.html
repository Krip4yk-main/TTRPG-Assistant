<h2 mat-dialog-title>{{ data.title | translate }}</h2>
<mat-dialog-content>
  <p>{{ data.text | translate: data.params }}</p>
  @if (data.note) {
    <p class="note">{{ data.note | translate }}</p>
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-stroked-button type="button" [mat-dialog-close]="false" cdkFocusInitial>
    {{ 'common.cancel' | translate }}
  </button>
  <!-- Підтвердження — залите, праворуч; небезпечне — кольору небезпеки дизайну. Правило рангів:
       небезпечна дія в рядках — текстом, підтвердження небезпечної дії в діалозі — залите. -->
  <button
    mat-flat-button
    type="button"
    [class.nri-danger-filled]="data.danger"
    [mat-dialog-close]="true"
  >
    {{ data.confirm | translate }}
  </button>
</mat-dialog-actions>
