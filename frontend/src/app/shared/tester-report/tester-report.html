@if (visible()) {
  @let ns = dev() ? 'testerReport' : 'testerReport.feedback';
  <button
    type="button"
    class="tester-report"
    [attr.aria-label]="ns + '.buttonLabel' | translate"
    [title]="ns + '.buttonLabel' | translate"
    aria-haspopup="dialog"
    (click)="open()"
  >
    <mat-icon aria-hidden="true">bug_report</mat-icon>
    <span class="label">{{ ns + '.button' | translate }}</span>
  </button>
}
