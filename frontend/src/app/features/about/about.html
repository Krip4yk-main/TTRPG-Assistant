<section class="nri-page">
  <h1>{{ 'about.title' | translate }}</h1>
  <div class="nri-card">
    <p>{{ 'about.description' | translate }}</p>
    <p class="nri-muted">{{ 'about.status' | translate }}</p>
  </div>

  <h2>{{ 'about.author.title' | translate }}</h2>
  <dl class="nri-card credits">
    @for (link of authorLinks; track link.key) {
      <dt>{{ link.key | translate }}</dt>
      <dd>
        <a
          [href]="link.href"
          [attr.target]="link.href.startsWith('mailto:') ? null : '_blank'"
          rel="noopener noreferrer"
          >{{ link.label }}</a
        >
      </dd>
    }
  </dl>
</section>
