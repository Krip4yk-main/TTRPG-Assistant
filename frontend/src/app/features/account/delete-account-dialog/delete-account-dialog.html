<h2 mat-dialog-title>{{ 'account.delete.confirmTitle' | translate }}</h2>
<mat-dialog-content>
  <p>{{ 'account.delete.confirmText' | translate }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-stroked-button type="button" [mat-dialog-close]="false" cdkFocusInitial>
    {{ 'common.cancel' | translate }}
  </button>
  <button mat-button class="nri-danger" type="button" [mat-dialog-close]="true">
    {{ 'account.delete.confirm' | translate }}
  </button>
</mat-dialog-actions>
