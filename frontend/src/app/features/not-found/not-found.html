<section class="nri-page nri-board not-found">
  <article class="nri-card qb-paper qb-torn notice" aria-labelledby="not-found-title">
    <span class="qb-pin" aria-hidden="true"></span>
    <p class="code" aria-hidden="true">404</p>
    <h1 id="not-found-title">{{ 'notFound.title' | translate }}</h1>
    <p class="nri-muted">{{ 'notFound.text' | translate }}</p>
    <div class="actions">
      <a mat-flat-button routerLink="/">{{ 'notFound.home' | translate }}</a>
      <a mat-stroked-button routerLink="/about">{{ 'notFound.about' | translate }}</a>
    </div>
  </article>
</section>
