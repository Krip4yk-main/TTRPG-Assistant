@let g = gm();
<span class="sign">
  <span class="initial" aria-hidden="true">{{ initial() }}</span>
  <span class="who">
    <span class="name">
      <span class="nri-visually-hidden">{{ 'search.card.gm' | translate }}:</span>
      @if (g.nickname) {
        <a
          class="gm-link"
          [routerLink]="['/users', g.publicId]"
          [nriTruncateTooltip]="g.nickname"
          >{{ g.nickname }}</a
        >
      } @else {
        {{ 'user.deleted' | translate }}
      }
      @if (g.blocked) {
        <nri-blocked-badge />
      }
    </span>
    <!-- Один рядок з «…»: без рейтингу «майстер · ще немає рейтингу» на вузькій картці не
         вміщається (повний текст — у підказці). -->
    @let none = g.showRating && g.rating === null;
    <small
      class="role"
      [nriTruncateTooltip]="
        none ? ('cyber.gm' | translate) + ' · ' + ('ratings.gmRating.none' | translate) : ''
      "
    >
      <span aria-hidden="true">{{ 'cyber.gm' | translate }}</span>
      @if (g.showRating) {
        <span aria-hidden="true">·</span>
        <nri-gm-rating [value]="g.rating" [showEmpty]="true" />
      }
    </small>
  </span>
</span>
