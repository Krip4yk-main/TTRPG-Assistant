@let g = gm(); {{ 'search.card.gm' | translate }}:
@if (g.nickname) {
  <a class="gm-link" [routerLink]="['/users', g.publicId]" [nriTruncateTooltip]="g.nickname">{{
    g.nickname
  }}</a>
} @else {
  {{ 'user.deleted' | translate }}
}
<!-- Пробіли між тегами шаблон не зберігає: явний пробіл — відступ і місце переносу. -->
@if (g.blocked) {
  {{ ' ' }}<nri-blocked-badge />
}
@if (g.showRating) {
  {{ ' ' }}<nri-gm-rating [value]="g.rating" [showEmpty]="true" />
}
