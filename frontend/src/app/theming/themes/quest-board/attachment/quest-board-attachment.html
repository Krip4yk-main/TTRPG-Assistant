<!-- Клік / Enter / Space по кнопці спливає до хоста, а той перемикає вкладку. -->
<!-- Зона наведення: нерухома, на 3 px більша за обкладинку в спокої й завжди на її місці —
     показ / приховування від наведення керується нею, а не рухомою обкладинкою (інакше край,
     що зсувається з-під курсора, смикає анімацію). Клік по ній спливає до хоста (перемикає). -->
<span class="hover-zone" aria-hidden="true"></span>
<button
  type="button"
  class="attach"
  [attr.aria-label]="'questBoard.attachment.label' | translate: { title: att.title() }"
  [attr.aria-pressed]="att.front()"
  (blur)="att.onBlur()"
>
  <img
    [src]="att.src()"
    alt=""
    loading="lazy"
    referrerpolicy="no-referrer"
    (error)="att.onError()"
  />
</button>
