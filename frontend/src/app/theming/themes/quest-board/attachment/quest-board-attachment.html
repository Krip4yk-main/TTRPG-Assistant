<button
  type="button"
  class="attach"
  [attr.aria-label]="'questBoard.attachment.label' | translate: { title: title() }"
  [attr.aria-pressed]="front()"
  (click)="toggle()"
  (focus)="onFocus($event)"
  (blur)="back()"
  (keydown.escape)="back()"
  (mouseleave)="back()"
>
  <img
    [src]="src()"
    alt=""
    loading="lazy"
    referrerpolicy="no-referrer"
    (error)="failed.set(true)"
  />
</button>
