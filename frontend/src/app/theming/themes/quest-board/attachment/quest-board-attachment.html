<!-- Клік / Enter / Space по кнопці спливає до хоста, а той перемикає вкладку. -->
<button
  type="button"
  class="attach"
  [attr.aria-label]="'questBoard.attachment.label' | translate: { title: title() }"
  [attr.aria-pressed]="front()"
  (blur)="onBlur()"
>
  <img [src]="src()" alt="" loading="lazy" referrerpolicy="no-referrer" (error)="onError()" />
</button>
