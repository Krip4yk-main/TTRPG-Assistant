@let b = badge();
<span
  class="badge"
  [class]="b.kind"
  [class.qb-ribbon]="b.kind === 'fit'"
  [attr.data-fit]="b.kind === 'fit' ? b.value : null"
  [attr.data-status]="b.kind === 'status' ? b.value : null"
>
  @if (b.icon) {
    <mat-icon aria-hidden="true">{{ b.icon }}</mat-icon>
  }
  {{ b.labelKey | translate }}
</span>
