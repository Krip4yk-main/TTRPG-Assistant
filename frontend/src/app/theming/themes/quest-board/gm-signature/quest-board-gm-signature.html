@let g = gm();
<span class="sign">
  <span class="initial" aria-hidden="true">{{ initial() }}</span>
  <span class="who">
    <span class="name">
      <span class="nri-visually-hidden">{{ 'search.card.gm' | translate }}:</span>
      @if (g.nickname) {
        <a
          class="gm-link"
          [routerLink]="['/users', g.publicId]"
          [nriTruncateTooltip]="g.nickname"
          >{{ g.nickname }}</a
        >
      } @else {
        {{ 'user.deleted' | translate }}
      }
      @if (g.blocked) {
        <nri-blocked-badge />
      }
    </span>
    <!-- Рядок «майстер · ★ рейтинг» (як у сцені) не обрізається — переноситься; підказка (той
         самий текст повністю) лишається запобіжником. -->
    @let tip = roleTip();
    <small class="role" [nriTruncateTooltip]="tip.key | translate: tip.params">
      <span aria-hidden="true">{{ 'questBoard.gm' | translate }}</span>
      @if (g.showRating) {
        <span aria-hidden="true">·</span>
        <nri-gm-rating [value]="g.rating" [showEmpty]="true" />
      }
    </small>
  </span>
</span>
