# Перевірка кожного push і PR: typecheck, lint і тести всіх воркспейсів.
name: CI

# Тимчасово вимкнено автозапуск (рішення власника 2026-11-27): лише вручну з вкладки Actions.
# Щоб увімкнути знову — повернути тригери push (main) і pull_request.
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.4
        env:
          # Лише для одноразової тестової БД у CI, не секрет.
          MYSQL_ROOT_PASSWORD: ci-root
          # Базова тестова БД: з неї global-setup створює nri_test_1…N.
          MYSQL_DATABASE: nri_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:8
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      DATABASE_URL_TEST: mysql://root:ci-root@127.0.0.1:3306/nri_test
      REDIS_URL: redis://127.0.0.1:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26 # як у Docker-образах
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests (shared, backend, frontend, bot)
        run: npm test
